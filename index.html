function selectSide(side){
  selectedSide = side;

  document.getElementById("leftBtn").classList.remove("selected");
  document.getElementById("rightBtn").classList.remove("selected");

  // zvýraznit vybraný
  if(side === "left"){
    document.getElementById("leftBtn").classList.add("selected");
  } else {
    document.getElementById("rightBtn").classList.add("selected");
  }
}

function draw(){
  ctx.fillStyle = "black";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "white";
  ctx.fillRect(player.x, player.y, 15, 120);
  ctx.fillRect(ai.x, ai.y, 15, 120);

  ctx.beginPath();
  ctx.arc(ball.x, ball.y, 12, 0, Math.PI*2);
  ctx.fill();

// PAUSE overlay

  ctx.font = "30px Arial";
  ctx.textAlign = "center";
  ctx.fillText("PAUSE", canvas.width / 2, canvas.height / 2);

ctx.font = "20px Arial";

ctx.fillText(scoreAI, canvas.width * 3 / 4, 30);

  ctx.font = "30px Arial";
  ctx.textAlign = "center";

  ctx.fillText("Vyhrál levý hráč!", canvas.width / 2, canvas.height / 2);
} else {
  ctx.fillText("Vyhrál pravý hráč!", canvas.width / 2, canvas.height / 2);
}

}

}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);

function togglePause(){
  if(gameState === "playing"){
    gameState = "paused";
    document.getElementById("pauseBtn").innerText = "Pokračovat";
  } else if(gameState === "paused"){
    gameState = "playing";
    document.getElementById("pauseBtn").innerText = "Pause";
  }
}

function goToMenu(){
  gameState = "menu";

  document.getElementById("menu").style.display = "block";
  document.getElementById("controls").style.display = "none";

  document.getElementById("pauseBtn").innerText = "Pause";

}



document.addEventListener("keydown", e =>{

    if(e.key==="ArrowDown") player.dy = 5;
  } else {
    if(e.key==="ArrowUp") player.dy = -5;
    if(e.key==="ArrowDown") player.dy = 5;
  }
});


document.addEventListener("keyup", e =>{
