
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ping Pong</title>
</head>

<body style="margin:0;background:black;display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column;color:white;font-family:Arial;">

<h1>🏓 Ping Pong</h1>

<canvas id="game" width="600" height="400" style="border:1px solid white"></canvas>

<p>Ovládání: ↑ ↓</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const paddleHeight = 80;
const paddleWidth = 10;

let playerY = 150;
let playerDY = 0;

let aiY = 150;

let scorePlayer = 0;
let scoreAI = 0;

let ball = {
  x: canvas.width / 2,
  y: canvas.height / 2,
  dx: 4,
  dy: 4,
  size: 8
};

// Ovládání
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowUp") playerDY = -6;
  if (e.key === "ArrowDown") playerDY = 6;
});

document.addEventListener("keyup", (e) => {
  if (e.key === "ArrowUp" || e.key === "ArrowDown") playerDY = 0;
});

// Update hry
function update() {
  playerY += playerDY;

  if (playerY < 0) playerY = 0;
  if (playerY + paddleHeight > canvas.height)
    playerY = canvas.height - paddleHeight;

  // AI sleduje míček
  aiY += (ball.y - (aiY + paddleHeight / 2)) * 0.08;

  // pohyb míčku
  ball.x += ball.dx;
  ball.y += ball.dy;

  // odraz top/bottom
  if (ball.y < 0 || ball.y > canvas.height) ball.dy *= -1;

  // kolize hráč
  if (
    ball.x < 20 &&
    ball.y > playerY &&
    ball.y < playerY + paddleHeight
  ) {
    ball.dx *= -1;
  }

  // kolize AI
  if (
    ball.x > canvas.width - 20 &&
    ball.y > aiY &&
    ball.y < aiY + paddleHeight
  ) {
    ball.dx *= -1;
  }

  // skóre
  if (ball.x < 0) {
    scoreAI++;
    resetBall();
  }

  if (ball.x > canvas.width) {
    scorePlayer++;
    resetBall();
  }
}

function resetBall() {
  ball.x = canvas.width / 2;
  ball.y = canvas.height / 2;
  ball.dx *= -1;
}

// vykreslení
function draw() {
  ctx.fillStyle = "black";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // středová čára
  ctx.setLineDash([10, 10]);
  ctx.strokeStyle = "white";
  ctx.beginPath();
  ctx.moveTo(canvas.width / 2, 0);
  ctx.lineTo(canvas.width / 2, canvas.height);
  ctx.stroke();
  ctx.setLineDash([]);

  // pálky
  ctx.fillStyle = "white";
  ctx.fillRect(10, playerY, paddleWidth, paddleHeight);
  ctx.fillRect(canvas.width - 20, aiY, paddleWidth, paddleHeight);

  // míček
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.size, 0, Math.PI * 2);
  ctx.fill();

  // skóre
  ctx.font = "20px Arial";
  ctx.fillText(scorePlayer, canvas.width / 4, 30);
  ctx.fillText(scoreAI, (canvas.width * 3) / 4, 30);
}

// loop
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
